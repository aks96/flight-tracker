# Shared configuration for the API and the worker — same image, same env,
  # different command.
x-backend-env: &backend-env
  NODE_ENV: production
  HOST: 0.0.0.0
  # DATABASE_URL/REDIS_URL are what the app actually reads. The discrete
  # DB_*/REDIS_* vars are also understood by config/env.ts, but building the
  # URLs here keeps the contract explicit.
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-flight_tracker}
  DB_SSL: "false"
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_EXPIRY: ${JWT_EXPIRY:-15m}
  JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
  DUFFEL_API_KEY: ${DUFFEL_API_KEY:?DUFFEL_API_KEY is required}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@watchmyfares.com}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
  PRICE_FETCH_INTERVAL_MS: ${PRICE_FETCH_INTERVAL_MS:-300000}
  MAX_CONCURRENT_PRICE_FETCHES: ${MAX_CONCURRENT_PRICE_FETCHES:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: flight-tracker-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-flight_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: the database is reachable only from the compose
    # network. Publishing 5432 put it on the host's public interface.
    expose:
      - "5432"
    networks:
      - flight-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flight-tracker-cache
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - flight-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-tracker-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      PORT: ${PORT:-3000}
      # The scheduler runs in the worker service below, never here — one
      # scheduler total, however many API replicas there are.
      RUN_SCHEDULER_IN_PROCESS: "false"
    expose:
      - "3000"
    networks:
      - flight-tracker-network
    # No source bind-mount: the image is the artifact. Mounting ./apps/backend
    # over it shadowed the built dist/ with whatever was on the host.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Exactly one instance. Scaling this to N would start N schedulers racing
  # over the same repeatable job.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-tracker-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    command: ["npm", "run", "worker", "--workspace", "apps/backend"]
    networks:
      - flight-tracker-network

  nginx:
    image: nginx:latest
    container_name: flight-tracker-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # cert.pem / key.pem — issue them with certbot before first start.
      - ./certs:/etc/nginx/certs:ro
      # ACME webroot, so certbot can answer HTTP-01 challenges on renewal.
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
    networks:
      - flight-tracker-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_webroot:
    driver: local

networks:
  flight-tracker-network:
    driver: bridge
